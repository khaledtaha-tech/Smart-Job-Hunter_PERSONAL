name: Patch Company Excel Import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-company-excel.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch application source
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/job-hunter.tsx')
          text = path.read_text()

          text = text.replace(
            'import { applicationsToCsv, dataToExcelXml, excelXmlToData } from "./data-transfer";\n',
            'import { applicationsToCsv, dataToExcelXml, excelXmlToData } from "./data-transfer";\nimport { downloadCompanyTemplate, readCompanyWorkbook } from "./company-transfer";\n'
          )
          text = text.replace(
            '{ id: "c3", name: "Muna Noor Manufacturing", country: "Oman", website: "https://www.munanoor.com/", notes: "Search company careers", favorite: true },',
            '{ id: "c3", name: "Muna Noor Manufacturing", country: "Oman", website: "https://www.munanoor.com/careers/", notes: "Direct careers page", favorite: true },'
          )
          text = text.replace(
            '  targetCompanies: "Target companies", companySub: "Build a focused list of employers worth checking directly.", addCompany: "Add company", visit: "Visit website",',
            '  targetCompanies: "Target companies", companySub: "Build a focused list of employers worth checking directly.", addCompany: "Add company", visit: "Visit Careers Page", downloadCompaniesTemplate: "Download Template", importCompanies: "Import Excel", careersPage: "Careers Page URL",'
          )
          text = text.replace(
            '  targetCompanies: "الشركات المستهدفة", companySub: "كوّن قائمة بالشركات التي تستحق المتابعة المباشرة.", addCompany: "إضافة شركة", visit: "فتح الموقع",',
            '  targetCompanies: "الشركات المستهدفة", companySub: "كوّن قائمة بالشركات التي تستحق المتابعة المباشرة.", addCompany: "إضافة شركة", visit: "فتح صفحة التوظيف", downloadCompaniesTemplate: "تحميل النموذج", importCompanies: "استيراد Excel", careersPage: "رابط صفحة التوظيف",'
          )
          text = text.replace(
            '  const excelImportRef = useRef<HTMLInputElement>(null);\n  const backupImportRef = useRef<HTMLInputElement>(null);',
            '  const excelImportRef = useRef<HTMLInputElement>(null);\n  const companyImportRef = useRef<HTMLInputElement>(null);\n  const backupImportRef = useRef<HTMLInputElement>(null);'
          )

          marker = '  const exportDatabaseBackup = async () => {'
          addition = '''  const importCompanyWorkbook = async (file?: File) => {\n    if (!file) return;\n    if (!POLICY.excelTransfer) return showUpgrade("Excel company import requires the Premium plan.");\n    try {\n      const imported = await readCompanyWorkbook(file);\n      const incoming = imported.map(row => ({ id: makeId(), name: row.name, country: row.country, website: row.website, notes: row.notes, favorite: true }));\n      setCompanies(current => {\n        const merged = new Map<string, Company>();\n        current.forEach(company => merged.set((company.website || `${company.name}|${company.country}`).trim().toLowerCase(), company));\n        incoming.forEach(company => merged.set((company.website || `${company.name}|${company.country}`).trim().toLowerCase(), company));\n        return Array.from(merged.values());\n      });\n      alert(`${incoming.length} companies imported successfully.`);\n    } catch (issue) {\n      alert(issue instanceof Error ? issue.message : "Unable to import the company workbook.");\n    }\n  };\n'''
          if addition not in text:
            text = text.replace(marker, addition + marker)

          text = text.replace(
            '          {page === "companies" && (POLICY.targetCompanies ? <CompaniesPage t={t} companies={companies} add={() => setCompanyModal(true)} remove={(id: string) => setCompanies(list => list.filter(c => c.id !== id))} toggleFavorite={(id: string) => setCompanies(list => list.map(c => c.id === id ? { ...c, favorite: !c.favorite } : c))} /> : <LockedPage title={t.targetCompanies} badge="STANDARD" text="Target-company tracking starts with the Standard plan." upgrade={showUpgrade} />)}',
            '          {page === "companies" && (POLICY.targetCompanies ? <CompaniesPage t={t} companies={companies} add={() => setCompanyModal(true)} remove={(id: string) => setCompanies(list => list.filter(c => c.id !== id))} toggleFavorite={(id: string) => setCompanies(list => list.map(c => c.id === id ? { ...c, favorite: !c.favorite } : c))} excelTransfer={POLICY.excelTransfer} downloadTemplate={downloadCompanyTemplate} importExcel={() => companyImportRef.current?.click()} upgrade={showUpgrade} /> : <LockedPage title={t.targetCompanies} badge="STANDARD" text="Target-company tracking starts with the Standard plan." upgrade={showUpgrade} />)}'
          )
          text = text.replace(
            '      <input ref={excelImportRef} hidden type="file" accept=".xml,text/xml,application/xml,application/vnd.ms-excel" onChange={e => { importExcel(e.target.files?.[0]); e.currentTarget.value = ""; }} />\n      <input ref={backupImportRef}',
            '      <input ref={excelImportRef} hidden type="file" accept=".xml,text/xml,application/xml,application/vnd.ms-excel" onChange={e => { importExcel(e.target.files?.[0]); e.currentTarget.value = ""; }} />\n      <input ref={companyImportRef} hidden type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onChange={e => { importCompanyWorkbook(e.target.files?.[0]); e.currentTarget.value = ""; }} />\n      <input ref={backupImportRef}'
          )
          text = text.replace(
            'function CompaniesPage({ t, companies, add, remove, toggleFavorite }: any) {\n  return <><PageHeading title={t.targetCompanies} text={t.companySub} action={<button className="btn primary" onClick={add}><Plus size={18} />{t.addCompany}</button>} />',
            'function CompaniesPage({ t, companies, add, remove, toggleFavorite, excelTransfer, downloadTemplate, importExcel, upgrade }: any) {\n  const actions = <div className="button-row">{excelTransfer ? <><button className="btn secondary" onClick={downloadTemplate}><Download size={17} />{t.downloadCompaniesTemplate}</button><button className="btn secondary" onClick={importExcel}><Upload size={17} />{t.importCompanies}</button></> : <button className="btn secondary locked-action" onClick={() => upgrade("Excel company import requires the Premium plan.")}><Lock size={16} />Excel · Premium</button>}<button className="btn primary" onClick={add}><Plus size={18} />{t.addCompany}</button></div>;\n  return <><PageHeading title={t.targetCompanies} text={t.companySub} action={actions} />'
          )
          text = text.replace(
            'function CompanyModal({ t, close, save }: { t: typeof EN; close: () => void; save: (form: FormData) => void }) { return <SimpleModal title={t.addCompany} close={close}><form action={save}><div className="form-grid"><label className="span-2">{t.company}<input name="name" required autoFocus /></label><label>{t.country}<input name="country" /></label><label>Website<input name="website" type="url" placeholder="https://…" /></label>',
            'function CompanyModal({ t, close, save }: { t: typeof EN; close: () => void; save: (form: FormData) => void }) { return <SimpleModal title={t.addCompany} close={close}><form action={save}><div className="form-grid"><label className="span-2">{t.company}<input name="name" required autoFocus /></label><label>{t.country}<input name="country" /></label><label>{t.careersPage}<input name="website" type="url" placeholder="https://company.com/careers/" /></label>'
          )

          path.write_text(text)
      - name: Remove patch workflow and commit
        run: |
          rm .github/workflows/patch-company-excel.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import target companies from Excel"
          git push origin HEAD:main
