name: Assemble master source
on:
  push:
    branches:
      - feature/real-master-upload
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify large source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          cat .upload/job-hunter.gz.b64.* | base64 --decode | gzip --decompress > app/job-hunter.tsx
          cat .upload/globals.gz.b64.* | base64 --decode | gzip --decompress > app/globals.css
          test "$(git hash-object app/job-hunter.tsx)" = "0d56aacd87f4780ccb18f4d357f6f0c9ee969744"
          test "$(git hash-object app/globals.css)" = "badcd092d2b034417a11bb3ae71b9e0c46e26d4d"
          rm -rf .upload
          rm -f .github/workflows/assemble-master.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize multi-tier master source"
          git push
