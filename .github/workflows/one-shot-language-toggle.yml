name: One-shot Commercial Language Toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-language-toggle.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add native language toggle
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/job-hunter.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<span className={`plan-badge ${EDITION.tier}`}>{EDITION.edition === "personal" ? <Sparkles size={13} /> : <Crown size={13} />}{planName}</span>\n            <button className="icon-btn" onClick={() => setDark(v => !v)} aria-label="Toggle theme">'
          new = '<span className={`plan-badge ${EDITION.tier}`}>{EDITION.edition === "personal" ? <Sparkles size={13} /> : <Crown size={13} />}{planName}</span>\n            <button className="language-toggle" onClick={() => setLanguage(value => value === "en" ? "ar" : "en")} aria-label="Toggle language">{language === "en" ? "AR" : "EN"}</button>\n            <button className="icon-btn" onClick={() => setDark(v => !v)} aria-label="Toggle theme">'
          if old not in text:
              raise SystemExit('Topbar anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          css = Path('hostinger/app.css')
          style = css.read_text(encoding='utf-8')
          marker = '.language-toggle {'
          if marker not in style:
              style += '''\n\n.language-toggle {\n  min-width: 46px;\n  height: 42px;\n  padding: 0 12px;\n  border: 1px solid var(--border);\n  border-radius: 12px;\n  background: var(--card);\n  color: var(--text);\n  font: inherit;\n  font-size: 13px;\n  font-weight: 800;\n  cursor: pointer;\n  transition: 160ms ease;\n}\n.language-toggle:hover {\n  border-color: #a9bce8;\n  background: #f5f8ff;\n  color: #2e63df;\n}\n.dark .language-toggle:hover {\n  background: rgba(255,255,255,.06);\n}\n'''
              css.write_text(style, encoding='utf-8')

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build editions
        run: npm run build:editions

      - name: Prepare commercial demo
        shell: bash
        run: |
          demo="releases/Smart-Job-Hunter-Commercial-Premium"
          cat > "$demo/edition-config.js" <<'EOF'
          window.__SJH_EDITION__ = {
            edition: "commercial",
            tier: "premium",
            showPlastics: false,
            defaultMode: "general",
            auth: false,
            displayName: "Ahmad",
            buyUrl: ""
          };
          EOF
          cat > "$demo/product-config.php" <<'EOF'
          <?php
          return [
              'edition' => 'commercial',
              'tier' => 'premium',
          ];
          EOF
          sed -i 's#./edition-config.js#./edition-config.js?v=commercial-lang-20260902#g' "$demo/index.html"

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/job-hunter.tsx hostinger/app.css
          git commit -m "feat: add AR EN language toggle" || true
          git push origin HEAD:main

      - name: Publish commercial demo branch
        shell: bash
        run: |
          demo="releases/Smart-Job-Hunter-Commercial-Premium"
          temp_dir="$(mktemp -d)"
          cp -R "$demo/." "$temp_dir/"
          git checkout --orphan publish-commercial-demo
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$temp_dir/." .
          git add -A
          git commit -m "deploy: build Commercial Premium Demo"
          git push --force origin HEAD:deploy-commercial-demo
