name: Build Personal Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-personal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Build all editions
        run: npm run build:editions

      - name: Publish Personal Edition branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smart-job-hunter-personal
          cp -R releases/Khaled-Personal/. /tmp/smart-job-hunter-personal/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy-personal
          git rm -rf .
          cp -R /tmp/smart-job-hunter-personal/. .
          git add -A
          git commit -m "deploy: build Personal Edition"
          git push --force origin deploy-personal
