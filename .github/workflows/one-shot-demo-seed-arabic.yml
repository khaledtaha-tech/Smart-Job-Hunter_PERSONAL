name: One-shot Demo Seed and Arabic Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-demo-seed-arabic.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Arabic labels and demo data
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/job-hunter.tsx')
          text = path.read_text(encoding='utf-8')

          anchor = 'const SEARCH_SITES = ['
          insert = '''const AR_FIELD_LABELS: Record<string, string> = {
            "Engineering & Manufacturing": "الهندسة والتصنيع",
            "Information Technology": "تقنية المعلومات",
